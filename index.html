<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Image Unit Tests</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 2em; 
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2 {
            color: #1a1a1a;
        }
        canvas { 
            border: 1px solid #ccc;
            margin-bottom: 1em; 
            background-color: white;
            display: block;
        }
        #audio-controls {
            margin: 1em 0;
        }
        #results { 
            white-space: pre-wrap; 
            background: #e9e9f3;
            padding: 1em; 
            border-radius: 8px;
            border: 1px solid #d1d1e0;
            min-height: 150px;
            font-family: "Courier New", Courier, monospace;
        }
        .status {
            font-weight: bold;
        }
        .status.passed {
            color: #28a745;
        }
        .status.failed {
            color: #dc3545;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Dragon Image Unit Tests</h1>
    <p>Running a series of automated tests on a generated dragon image. Click the button below to start.</p>
    <button id="run-tests-btn">Run Tests</button>
    <div id="canvas-container">
      <canvas id="testCanvas" width="512" height="512"></canvas>
    </div>
    <div id="audio-controls"></div>
    <h2>Test Results:</h2>
    <pre id="results">Click the "Run Tests" button to start.</pre>

    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="tests.js"></script>

</html>
